# --- DATABASE CONFIG (POSTGRESQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/badminton_db}
spring.datasource.username=${DB_USERNAME:badminton_app_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIBERNATE MAGIC ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- JWT SECURITY CONFIG ---
jwt.secret=c2VjcmV0X2tleV9mb3JfYmFkbWludG9uX2Jvb2tpbmdfc3lzdGVtX3NlY3VyZV8yNTZfYml0c19rZXlfISEh
jwt.expiration=3600000
jwt.refresh-expiration=1209600000

# --- EMAIL CONFIG (GMAIL SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- SERVER CONFIG ---
server.port=8080
