<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mã xác thực OTP</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { background-color: #28a745; color: white; padding: 10px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; text-align: center; }
        .otp-code { font-size: 2em; font-weight: bold; color: #28a745; letter-spacing: 5px; margin: 20px 0; }
        .footer { text-align: center; font-size: 0.8em; color: #777; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Xác Thực Tài Khoản</h2>
        </div>
        <div class="content">
            <p>Xin chào <strong th:text="${name}">User</strong>,</p>
            <p>Mã OTP xác thực tài khoản của bạn là:</p>

            <div class="otp-code" th:text="${otp}">123456</div>

            <p>Mã này sẽ hết hạn sau 5 phút.</p>
            <p>Vui lòng không chia sẻ mã này cho bất kỳ ai.</p>
        </div>
        <div class="footer">
            <p>&copy; 2025 Badminton Booking System</p>
        </div>
    </div>
</body>
</html>
